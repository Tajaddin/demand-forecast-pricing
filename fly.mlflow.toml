# MLflow tracking server and model registry on Fly.io: sqlite plus artifacts on one volume, basic auth in front.
app = "dfp-mlflow"
primary_region = "mia"

[build]
  image = "ghcr.io/mlflow/mlflow:v3.17.1"

[processes]
  app = "mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////data/mlflow.db --artifacts-destination /data/artifacts --serve-artifacts --app-name basic-auth --allowed-hosts dfp-mlflow.fly.dev,dfp-mlflow.internal:5000"

[mounts]
  source = "mlflow_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
