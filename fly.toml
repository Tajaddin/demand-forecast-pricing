# The API on Fly.io. MLflow must be reachable from the machine (MLFLOW_TRACKING_URI secret), for example a
# second Fly app running `mlflow server` with a volume, or a managed MLflow. scripts/deploy.sh sets both up.
app = "dfp-api"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  DFP_LOG_LEVEL = "info"
  DFP_RATE_LIMIT = "60/minute"
  DFP_REPORTS_DIR = "/app/reports"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
