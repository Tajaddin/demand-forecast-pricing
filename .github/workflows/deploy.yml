name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  fly:
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with: { version: "0.10.4" }
      - run: uv sync && uv run dfp data && uv run dfp elasticity && uv run dfp backtest --folds 2 --step 14 --no-prophet
        env: { MLFLOW_TRACKING_URI: sqlite:///mlflow.db }
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy -c fly.toml --remote-only
      - run: curl -fsS "${VARS_API_URL}/metrics" >/dev/null
        env:
          VARS_API_URL: ${{ vars.API_URL }}
