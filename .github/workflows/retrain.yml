name: retrain

# Weekly retrain with the drift gate against the production MLflow (MLFLOW_TRACKING_URI secret, plus
# MLFLOW_TRACKING_USERNAME and MLFLOW_TRACKING_PASSWORD if the server has basic auth). Without the URI secret
# it uses a throwaway SQLite store, so the gates still run and nothing is registered. The run's reports are
# kept as an artifact either way.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: "inject a synthetic shock to demonstrate the gate"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    environment: production
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///mlflow.db' }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.10.4", enable-cache: true }
      - run: uv sync
      - run: uv run dfp data
      - run: uv run dfp retrain ${{ inputs.simulate_drift && '--simulate-drift' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: retrain-reports, path: reports, retention-days: 30 }
